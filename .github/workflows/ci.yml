name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            backend/DocxGen.Ui.Backend/packages.lock.json
            tests/DocxGen.Ui.Backend.Tests/packages.lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.6.2

      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Restore .NET
        run: dotnet restore DocxGen.Ui.slnx --locked-mode

      - name: Build .NET
        run: dotnet build DocxGen.Ui.slnx --configuration Release --no-restore

      - name: Test .NET
        run: dotnet test DocxGen.Ui.slnx --configuration Release --no-build

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Prepare backend sidecar
        run: node eng/prepare-sidecar.mjs --configuration Release

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
