name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x64
            platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS x64
            platform: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS arm64
            platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.6.2

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare backend sidecar
        run: node eng/prepare-sidecar.mjs --target ${{ matrix.target }} --configuration Release

      - name: Build and publish native bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DocxGen UI ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your operating system below.

            This release is unsigned. Windows SmartScreen or macOS Gatekeeper
            may show an unverified-publisher warning.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
