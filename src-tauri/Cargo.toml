[package]
name = "docxgen-ui"
version = "0.1.1"
description = "Cross-platform desktop UI for DocxGen"
authors = ["Akode"]
license = "MIT"
repository = "https://github.com/akode-dev/docxgenui"
edition = "2024"
rust-version = "1.88"

[lib]
name = "docxgen_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.23.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-shell = "2.3.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
